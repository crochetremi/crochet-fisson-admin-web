- name: debian-admin-web-prj
  hosts: localhost
  connection: local
  become: yes

  tasks:
    # Mettre à jour le cache APT pour partir d'une base propre
    #- name: Mettre à jour le cache APT
    #  apt:
    #    update_cache: yes

    - name: Installer Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
    
    - name: Configurer le domaine LDAP par défaut
      debconf:
        name: slapd
        question: slapd/domain
        value: "iutnc-crochet-fisson.local"
        vtype: string

    - name: Configurer le mot de passe administrateur LDAP
      debconf:
        name: slapd
        question: slapd/root_password
        value: "a"
        vtype: password

    - name: Confirmer le mot de passe administrateur LDAP
      debconf:
        name: slapd
        question: slapd/root_password_again
        value: "a"
        vtype: password

    - name: Ignorer la purge de la base de données
      debconf:
        name: slapd
        question: slapd/purge_database
        value: "false"
        vtype: boolean

    - name: Installer LDAP
      apt:
        name:
          - slapd
          - ldap-utils
        state: present
      
    - name: Créer le dossier d'exécution pour slapd
      file:
        path: /run/slapd
        state: directory
        owner: openldap
        group: openldap
        mode: '0755'

    - name: Démarrer slapd temporairement en arrière-plan
      command: /usr/sbin/slapd -h "ldapi:///" -u openldap -g openldap

    - name: Laisser le temps au service de s'initialiser
      pause:
        seconds: 2

    - name: Forcer le mot de passe administrateur
      shell: |
        cat <<EOF > /tmp/update_pass.ldif
        dn: olcDatabase={1}mdb,cn=config
        changetype: modify
        replace: olcRootPW
        olcRootPW: $(slappasswd -s "a")
        EOF
        ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/update_pass.ldif
      args:
        executable: /bin/bash

    - name: Transférer le fichier LDIF des utilisateurs
      copy:
        src: nextcloud-users.ldif
        dest: /ansible/nextcloud-users.ldif
        owner: root
        mode: '0644'
    
    - name: Importer les utilisateurs Nextcloud dans l'annuaire
      command: ldapadd -H ldapi:/// -x -D "cn=admin,dc=iutnc-crochet-fisson,dc=local" -w "a" -f /ansible/nextcloud-users.ldif

    - name: Éteindre le slapd temporaire proprement
      shell: kill $(cat /run/slapd/slapd.pid)
